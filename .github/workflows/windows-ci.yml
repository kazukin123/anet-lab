name: Windows Build

on:
  push:
    branches: [ ]
  pull_request:
    branches: [ ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    strategy:
      fail-fast: false # どちらかが失敗しても、もう片方は続ける
      matrix:
        build_type: [Debug, RelWithDebInfo, Release] 

    env:
      # マトリックス変数を使用
      BUILD_TYPE: ${{ matrix.build_type }}
      LIBTORCH_VER: "2.9.1-cu130"
      WX_VER: "3.3.1"

    steps:
    - uses: actions/checkout@v4

    # ----------------------------------------------------------------
    # CUDA Toolkit
    # ----------------------------------------------------------------
    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.30
      id: cuda-toolkit
      with:
        cuda: '13.0.0'

    # ----------------------------------------------------------------
    # LibTorch のキャッシュ (構成によらず共通)
    # ----------------------------------------------------------------
    - name: Cache LibTorch
      id: cache-libtorch
      uses: actions/cache@v3
      with:
        path: deps/libtorch
        key: libtorch-${{ env.LIBTORCH_VER }}-windows-v1

    - name: Download and Extract LibTorch
      if: steps.cache-libtorch.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path deps
        $urlRel = "https://download.pytorch.org/libtorch/cu130/libtorch-win-shared-with-deps-2.11.0%2Bcu130.zip"
        $urlDbg = "https://download.pytorch.org/libtorch/cu130/libtorch-win-shared-with-deps-debug-2.11.0%2Bcu130.zip"

        # 並列DLせず順次DLして確実に配置
        Write-Host "Downloading LibTorch Release..."
        Invoke-WebRequest -Uri $urlRel -OutFile libtorch-release.zip
        Write-Host "Downloading LibTorch Debug..."
        Invoke-WebRequest -Uri $urlDbg -OutFile libtorch-debug.zip

        Write-Host "Extracting Release..."
        Expand-Archive -Path libtorch-release.zip -DestinationPath temp_rel
        New-Item -ItemType Directory -Force -Path deps/libtorch/release
        Move-Item -Path temp_rel/libtorch/* -Destination deps/libtorch/release/

        Write-Host "Extracting Debug..."
        Expand-Archive -Path libtorch-debug.zip -DestinationPath temp_dbg
        New-Item -ItemType Directory -Force -Path deps/libtorch/debug
        Move-Item -Path temp_dbg/libtorch/* -Destination deps/libtorch/debug/

        Remove-Item libtorch-release.zip, libtorch-debug.zip
        Remove-Item temp_rel, temp_dbg -Recurse -Force

    # ----------------------------------------------------------------
    # wxWidgets のキャッシュとビルド
    #    配置場所: third_party/wxwidgets
    # ----------------------------------------------------------------
    - name: Cache wxWidgets
      id: cache-wx
      uses: actions/cache@v3
      with:
        # インストール先（成果物）をキャッシュ対象にする
        path: third_party/wxwidgets/install
        key: wxwidgets-${{ env.WX_VER }}-vs2022-${{ matrix.build_type }}

    - name: Build wxWidgets (if not cached)
      if: steps.cache-wx.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # 1. パス定義
        $wxRoot  = "third_party/wxwidgets"
        $wxBuild = "$wxRoot/build"
        $wxInst  = "$wxRoot/install"

        # 2. フォルダ準備（ゴミが残っているとエラーになるので掃除）
        if (Test-Path $wxRoot) { Remove-Item $wxRoot -Recurse -Force }
        New-Item -ItemType Directory -Force -Path $wxRoot

        # 3. Clone (third_party/wxwidgets 直下にソースを展開)
        #    Note: git clone でフォルダ自体が作られるので、親ディレクトリで実行する
        git clone --branch v${{ env.WX_VER }} --depth 1 --recurse-submodules --shallow-submodules https://github.com/wxWidgets/wxWidgets.git $wxRoot

        # 4. CMake Configure
        #    ソース: $wxRoot
        #    ビルド作業: $wxBuild
        #    インストール先: $wxInst
        cmake -S $wxRoot -B $wxBuild `
          -DCMAKE_INSTALL_PREFIX="$wxInst" `
          -DCMAKE_CONFIGURATION_TYPES="${{ matrix.build_type }}" `
          -DwxBUILD_SHARED=ON `
          -DwxBUILD_PRECOMP=ON

        # 5. Build
        cmake --build $wxBuild --config ${{ matrix.build_type }} --parallel

        # 6. Install (ここで cmake_install.cmake が使われる)
        cmake --install $wxBuild --config ${{ matrix.build_type }}

        # 7. ビルド中間ファイルの削除（キャッシュ容量節約のためbuild だけ消しておく）
        Remove-Item $wxBuild -Recurse -Force

    # ----------------------------------------------------------------
    # メインプロジェクト (anet-lab)
    # ----------------------------------------------------------------
    - name: Configure CMake
      shell: pwsh
      run: |
        $env:Torch_DIR_RELEASE = "${{ github.workspace }}/deps/libtorch/release/share/cmake/Torch"
        $env:Torch_DIR_DEBUG   = "${{ github.workspace }}/deps/libtorch/debug/share/cmake/Torch"
        
        $wxInst = "${{ github.workspace }}/third_party/wxwidgets/install"
        
        # 【デバッグ用】実際にどんなファイルが生成されたか確認する
        Write-Host "=== Checking wxWidgets Lib folder ==="
        if (Test-Path "$wxInst/lib") {
            Get-ChildItem -Path "$wxInst/lib" -Dir
        } else {
            Write-Error "wxWidgets lib folder not found!"
        }

        # ROOTではなくDIRを使い、Configモードを強制する
        # wxWidgetsConfig.cmake があるディレクトリを指定
        $env:wxWidgets_DIR = "$wxInst/lib/cmake/wxWidgets"
        
        # 念のため ROOT は空にしておく
        $env:wxWidgets_ROOT = ""

        # CUDAパス表示
        Write-Host "CUDA_PATH is: $env:CUDA_PATH"

        # ビルド
        cmake -B build `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_CONFIGURATION_TYPES="${{ matrix.build_type }}" `
          -DCUDAToolkit_ROOT="$env:CUDA_PATH" `
          -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH/bin/nvcc.exe" `
          -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON `
          -DwxWidgets_DIR="$wxInst/lib/cmake/wxWidgets"

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel
