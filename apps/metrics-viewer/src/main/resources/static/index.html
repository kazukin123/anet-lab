<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="/favicon.png">
<title>Metrics Viewer</title>

<!-- Plotly -->
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<!-- CSS -->
<link rel="stylesheet" href="metrics-viewer.css" />

</head>

<body class="uninitialized">
<div id="layout">
	<!-- Side Panel -->
	<div id="side-panel">
		<div id="side-header">
			<span id="loading-spinner" class="loading-spinner" title="Loading..."></span>
			<h2>Metrics Viewer</h2>
			<span id="update-status" hidden></span>
			<div class="header-buttons">
				<button id="btn-screenshot" title="Screenshot Mode">×</button>
			</div>
		</div>

		<div class="global-controls">
			<label class="workspace-control" for="workspace-selector">
				<span>Workspace</span>
				<select id="workspace-selector" aria-label="Workspace"></select>
			</label>
			<button id="btn-reload">Reload</button>
			<button id="btn-auto-reload" aria-pressed="false">Auto Reload</button>
		</div>

		<div class="section" id="run-section">
			<div class="section-header"><label>Runs</label></div>
			<div class="section-controls">
				<button id="btn-select-all-runs">Select All</button>
				<button id="btn-latest-only">Select Latest</button>
				<button id="btn-recolor-runs"
						title="Give the selected runs the most distinguishable colors">Recolor</button>
				<button id="btn-auto-recolor" aria-pressed="false"
						title="Keep the selected runs distinguishable as the selection changes">Auto Recolor</button>
			</div>
			<!-- Runリスト（JSで生成される） -->
			<div id="run-list"></div>
		</div>

		<div class="section" id="tag-section">
			<div class="section-header"><label>Tags</label></div>
			<div class="section-controls">
				<button id="btn-select-all">Select All</button>
				<button id="btn-clear-all">Clear All</button>
				<button id="btn-selected-only" aria-pressed="false"
						title="Show only the selected tags">Selected Only</button>
			</div>
			<!-- Tagリスト（初期構成あり、JSで上書きまたは活用） -->
			<ul id="tag-list">
			</ul>
		</div>
	</div>

	<!-- Main Area -->
	<div id="main-panel">
		<div id="screenshot-header"></div>
		<div id="main-area">
		</div>
	</div>
</div>

<!-- 常時右上に表示される描画・操作コントロール -->
<div id="floating-controls">
	<span id="lod-display-mode-control">
		<label for="lod-display-mode">LOD:</label>
		<select id="lod-display-mode">
			<option value="MinMax">MinMax</option>
			<option value="Mean">Mean</option>
			<option value="Band">Band</option>
		</select>
	</span>
	<button id="btn-reset-view" title="Show all series and reset all axes">Reset View</button>
	<button id="btn-graph-scroll-lock" aria-pressed="false" title="Toggle graph scroll lock">Scroll Lock</button>
	<button id="btn-screenshot-toggle">⬅</button>
</div>

<!-- アプリスクリプト -->
<script src="metrics-viewer.js"></script>
</body>
</html>
