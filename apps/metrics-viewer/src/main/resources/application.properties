

## httpd
server.port=8082
#server.compression.enabled=true
server.compression.enabled=false
server.compression.mime-types=application/json,text/html,text/xml,text/plain
server.compression.min-response-size=512

server.tomcat.connection-timeout=600000
server.tomcat.keep-alive-timeout=600000
server.tomcat.max-keep-alive-requests=1000
spring.mvc.async.request-timeout=600000
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

## 実行設定
metricsviewer.runs-dir=runs


## 全体をDEBUGレベルに
#logging.level.root=DEBUG

## logging
logging.file.path=logs
#logging.file.name=metrics-viewer.log


## log package
#logging.level.io.github.kazukin123.anetlab.metricsviewer=DEBUG
#logging.level.io.github.kazukin123.anetlab.metricsviewer.view.MetricsViewerController=DEBUG
#logging.level.io.github.kazukin123.anetlab.metricsviewer.service.MetricsService=DEBUG
