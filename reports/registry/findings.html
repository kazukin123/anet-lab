<script id="data" type="application/json">[{"lens": "refactor", "category": "1関心1機構違反", "title": "排他的な外れ値表示モードを二つのSetと分散した排他処理で保持している", "file": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "symbol": "MetricsViewerClientApp.outlierPercentile", "evidence": [{"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2001, "note": "二つのtoggleが相手のSetを消す"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2023, "note": "二つのSetから優先順でpercentileを復元"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2423, "note": "永続状態の復元にも排他違反の補正が必要"}], "summary": "同じtagの外れ値表示はoff・p5–p95・p1–p99の択一だが、ignoreOutlierTagsとp1P99Tagsの二つの集合で表現している。排他条件をtoggle、復元、描画値の選択へ分散させている。現状の補正は存在し、表示バグを指摘するものではない。 元の優先度P2を、対象範囲内で最多のchurn90=10のファイルとして1段上げた。", "scenario": "新しいpercentile表示を追加すると、集合と保存キーに加えて既存toggle双方、_loadStateの競合解消、outlierPercentileの優先順を同時に変更する必要がある。現状でも二つの保存集合へ同じtagが入った状態を_loadStateが補正している。", "fix_hint": "外れ値表示の状態遷移を一箇所へ集約し、内部ではtagごとの単一モードとして扱う。既存保存形式と競合時p1–p99優先の挙動を保つ入出力境界を明確にする。OutlierRangePlaywrightTestの排他・永続復元・手動Y範囲を特性テストとして確認し、描画経路の性能が同等であることを確認する。新しい保存契約へ変更する場合は別途設計判断を行う。", "priority": "P1", "confidence": "high", "topic": 5, "fingerprint": "bd2f6b297d54", "id": "F-0001", "status": "open", "first_seen": "2026-09-19", "last_seen": "2026-09-23", "updated": "2026-09-23", "run_id": "2026-09-23-claude", "history": [{"date": "2026-09-19", "status": "open", "note": "初出"}]}, {"lens": "defect", "category": "境界", "title": "未完成のLOD pageをbucketごとに全行読み直すため、LOD射影で読む行数が表示bucket数の2乗になる", "file": "apps/metrics-viewer/src/main/java/io/github/kazukin123/anetlab/metricsviewer/service/LodPageCache.java", "symbol": "LodPageCache.find", "evidence": [{"path": "apps/metrics-viewer/src/main/java/io/github/kazukin123/anetlab/metricsviewer/service/LodPageCache.java", "line": 50, "note": "cache missのたびに、1 bucketのためにpage全体（最大1024行）をSELECTする"}, {"path": "apps/metrics-viewer/src/main/java/io/github/kazukin123/anetlab/metricsviewer/service/LodPageCache.java", "line": 51, "note": "未完成pageは保持せず捨てるので、同じpageの次のbucketで再びloadPageが走る"}, {"path": "apps/metrics-viewer/src/main/java/io/github/kazukin123/anetlab/metricsviewer/service/LodPageCache.java", "line": 252, "note": "1024 bucket未満のpageは常に未完成扱い。つまり各tag・各levelの末尾pageは一度もcacheされない"}, {"path": "apps/metrics-viewer/src/main/java/io/github/kazukin123/anetlab/metricsviewer/service/MetricsRangeProjector.java", "line": 170, "note": "loadBucketsは選択したlevelの全bucketについて1件ずつpageCache.findを呼ぶ"}], "summary": "LodPageCache.findは未完成page（各tagの末尾page）を保持せず、呼ばれるたびにpage全体を読み直す。一方でMetricsRangeProjector.loadBucketsは表示範囲のbucketごとにfindを呼ぶ。このため末尾pageに入るB個のbucketについて、B回×最大B行を読み、12本の配列もB回確保することになり、query時間がO(B^2)になる。結果は正しいが、cacheを無効にした場合（capacity=0、bucket単位SELECT）より遅い。", "scenario": "10万点のtagを全域表示する（maxPoints=8000）→ selectLevelはlevel 2の391 bucketを選ぶ → 永続化済みの390 bucketはすべて未完成のpage 0にあり、391回のfindがそれぞれ390行を読む。合計約15万行で、生の点数10万より多い。10 Run×20 tagを同時表示すると1 requestで約3,000万行になり、permit（既定2）を長く占有して他のタブが503 query_busyになる。Auto Reloadのforce再取得のたびに同じことが起きる。", "fix_hint": "未完成pageをquery単位でmemoするか、loadBucketsで範囲を一括SELECTしてからbucketを引く", "priority": "P2", "confidence": "high", "topic": 5, "fingerprint": "4f61e525bbf6", "id": "F-0002", "status": "open", "first_seen": "2026-09-23", "last_seen": "2026-09-23", "updated": "2026-09-23", "run_id": "2026-09-23-claude", "history": [{"date": "2026-09-23", "status": "open", "note": "初出"}]}, {"lens": "defect", "category": "境界", "title": "window内に点が無いtagはgraph blockごと消え、全tag一括のReset View以外では戻せない", "file": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "symbol": "PlotlyController.renderBySelection", "evidence": [{"path": "apps/metrics-viewer/src/main/java/io/github/kazukin123/anetlab/metricsviewer/service/MetricsRepository.java", "line": 241, "note": "ordinal範囲は閉区間[fromStep,toStep]内の点だけで、範囲外の隣接点は含めない"}, {"path": "apps/metrics-viewer/src/main/java/io/github/kazukin123/anetlab/metricsviewer/service/MetricsQueryPlanner.java", "line": 86, "note": "範囲内が0点ならempty（取り込み中はpending）"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2082, "note": "empty/pendingの結果もwindowとして保存する"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 951, "note": "availabilityがok以外の系列はtraceを作らない"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 954, "note": "traceが0本のtagは、headerとLog/percentileボタンを含むgraph block自体を作らない"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 412, "note": "空windowが要求範囲を覆うので、以後needsFetchはfalseのまま"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 1976, "note": "tag単位のautorange復帰はgraph上のrelayout経由だけで、graphが無いと発火しない"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2284, "note": "graph無しでviewportをautorangeへ戻す経路は、全tag一括のonResetViewだけ"}], "summary": "serverは要求範囲内に点が無い系列をempty/pendingで返す。clientはok以外の系列を描かず、全Runがok以外のtagではgraph block自体を出さない。explicit viewportは残り、空windowが範囲を覆うので再取得も起きないため、そのgraphは操作手段ごと消えたままになる。元の優先度P2を、対象範囲内で最多のchurn90=10のファイルとして1段上げた。", "scenario": "LOD表示中のtagで、点の無い区間（長いepisodeによる間隔など）の中へ、その幅の1/3未満でbox zoomする。または末尾付近を拡大して右へ2〜3画面panし、window[from-w,to+w]が最終点を越える → 全Runがempty → そのtagのgraphが消える。double clickする対象も無く、tagの再選択やReloadでも同じviewportで再びemptyになる。floatingのReset Viewで全tagのzoomを捨てるか、ページを再読込するしか戻す手段がない。", "fix_hint": "explicit viewportを持つtagは、traceが0本でも空の軸だけのgraph blockを描く。またはserverが範囲外の直近点を両端に1点ずつ含める", "priority": "P1", "confidence": "high", "topic": 5, "fingerprint": "f0d34cb7aef6", "id": "F-0003", "status": "open", "first_seen": "2026-09-23", "last_seen": "2026-09-23", "updated": "2026-09-23", "run_id": "2026-09-23-claude", "history": [{"date": "2026-09-23", "status": "open", "note": "初出"}]}, {"lens": "defect", "category": "並行", "title": "DataFetcherの単一のabort枠を独立した呼び出し元が奪い合い、abortが失敗Toastや初期Run選択の喪失になる", "file": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "symbol": "MetricsViewerClientApp.onReload / onWorkspaceChanged", "evidence": [{"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 243, "note": "fetchRunsは呼び出し元を問わず直前のruns.jsonをabortする"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 280, "note": "fetchMetricsも直前のmetrics.jsonをabortする。_bumpQueryRevisionも同じ枠をabortする"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2087, "note": "requestVisibleDataはabortも含めて例外を再送出する"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2441, "note": "onReloadはAbortErrorや409 supersededでも無条件に『Reload failed.』を出す"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 1812, "note": "onWorkspaceChangedも無条件に『Workspace switched, but data refresh failed.』を出す"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2519, "note": "_handleQueryErrorとinit（1702行）はAbortError/supersededを除外しており、扱いが一致しない"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 1861, "note": "初期Run選択はinitial=trueのrefreshMetadataだけが行う"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2414, "note": "Auto Reloadのtickはinitial=falseでrefreshMetadataを呼ぶ"}], "summary": "runs.jsonとmetrics.jsonのAbortControllerはDataFetcherにそれぞれ1枠しかなく、Reload・Auto Reload・workspace切替・viewport変更・Run/tagのclickが互いの要求をabortする。abortされたonReload/onWorkspaceChangedは、abortやsupersededを失敗として通知してしまう。さらにworkspace切替のinitial=true要求がAuto Reloadのinitial=false要求にabortされると、初期Run選択が行われない。元の優先度P3を、対象範囲内で最多のchurn90=10のファイルとして1段上げた。", "scenario": "(a) Reloadを押した後、metrics.jsonの応答前にRunやtagをclickする → _bumpQueryRevisionがReloadの要求をabort → 『Reload failed.』が出る。workspace切替後の描画待ちにRunをclickした場合も『Workspace switched, but data refresh failed.』が出る。(b) Auto Reload ONでworkspaceを切り替え、切替側のruns.jsonの応答待ちにtickが来る → 切替側のrefreshMetadata（initial=true）がabortされてToastが出る。tick側（initial=false）が新workspaceを反映するが、選択Runは空のまま『No selection.』になる。", "fix_hint": "AbortError/supersededを失敗Toastの対象から外す。workspace切替の後処理中はAuto Reloadのmetadata取得を止めるか、initial要求を後発の要求へ引き継ぐ", "priority": "P2", "confidence": "high", "topic": 5, "fingerprint": "895fade05e01", "id": "F-0004", "status": "open", "first_seen": "2026-09-23", "last_seen": "2026-09-23", "updated": "2026-09-23", "run_id": "2026-09-23-claude", "history": [{"date": "2026-09-23", "status": "open", "note": "初出"}]}, {"lens": "defect", "category": "並行", "title": "初期化中にScreenshotへ切り替えるとinit完了時にmodeが上書きされ、init失敗時はScreenshotから抜けられない", "file": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "symbol": "MetricsViewerClientApp.init / onToggleScreenshot", "evidence": [{"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 1695, "note": "initはMETA_LOADINGにしてからworkspaceとmetadataをawaitする"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 2446, "note": "onToggleScreenshotはERROR以外（META_LOADINGを含む）で切替を許し、ERROR中は解除も拒否する"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 1699, "note": "init成功時は現在のmodeを見ずにNORMALへ上書きする"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.js", "line": 1704, "note": "init失敗時はERRORへ上書きし、screenshot-mode classは残る"}, {"path": "apps/metrics-viewer/src/main/resources/static/metrics-viewer.css", "line": 645, "note": "screenshot中はReloadを含むside panelが非表示"}], "summary": "META_LOADING中にScreenshotへ切り替えるとbodyはscreenshot-modeになるが、init完了時にmodeが無条件にNORMALかERRORへ上書きされ、画面とmodeが食い違う。scroll lockと取り込み進捗pollの停止はmode==SCREENSHOTで判定するため、画面はscreenshotのまま通常時の挙動になる。元の優先度P3を、対象範囲内で最多のchurn90=10のファイルとして1段上げた。", "scenario": "(a) runs.jsonが遅い起動中に×/⬅を押す → init完了でmode=NORMALだが画面はscreenshotのまま → scroll lockが外れてgraphのdragがzoom/panになり、止まるはずの進捗pollも続く。(b) 同じ操作の後にinitが失敗する → mode=ERROR、side panelは非表示、graphも無い → Reloadボタンもgraphのdouble click Reloadも使えず、onToggleScreenshotはERRORで何もせず戻る。F5以外で復帰できない。", "fix_hint": "META_LOADING中はscreenshot切替を無効にする。またはinit完了時にscreenshot状態を保ったままmodeを決め、ERROR中も解除だけは許可する", "priority": "P2", "confidence": "high", "topic": 5, "fingerprint": "315cba75b849", "id": "F-0005", "status": "open", "first_seen": "2026-09-23", "last_seen": "2026-09-23", "updated": "2026-09-23", "run_id": "2026-09-23-claude", "history": [{"date": "2026-09-23", "status": "open", "note": "初出"}]}]</script><script>
const R=JSON.parse(document.getElementById('data').textContent);document.getElementById('meta').textContent=`${R.length} 件 / 生成 2026-09-23`;
let sortK='priority',asc=true;const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){const q=document.getElementById('q').value.toLowerCase(),fs=document.getElementById('fs').value,fl=document.getElementById('fl').value,fp=document.getElementById('fp').value;
 let rows=R.filter(r=>(!fs||r.status===fs)&&(!fl||r.lens===fl)&&(!fp||r.priority===fp)&&(!q||[r.title,r.file,r.symbol,r.summary,r.category].join(' ').toLowerCase().includes(q)));
 rows.sort((a,b)=>{const x=a[sortK]??'',y=b[sortK]??'';const c=String(x).localeCompare(String(y));return asc?c:-c});
 document.getElementById('count').textContent=`${rows.length} 件表示`;
 document.querySelector('#t tbody').innerHTML=rows.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.status)}</td><td class="${esc(r.priority)}">${esc(r.priority)}</td><td>${esc(r.confidence)}</td><td>${esc(r.lens)}</td><td>${esc(r.category)}</td><td><code>${esc(r.file)}</code>${r.symbol?'::'+esc(r.symbol):''}</td><td><details><summary>${esc(r.title)}</summary><div>${esc(r.summary)}</div><div class="muted">${esc(r.scenario)}</div>${r.fix_hint?'<div>対処: '+esc(r.fix_hint)+'</div>':''}${(r.evidence||[]).map(e=>`<div class="muted">${esc(e.path)}:${esc(e.line)} ${esc(e.note||'')}</div>`).join('')}</details></td><td>${esc(r.first_seen)}</td><td>${esc(r.last_seen)}</td></tr>`).join('');}
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)asc=!asc;else{sortK=k;asc=true}render()});
['q','fs','fl','fp'].forEach(id=>document.getElementById(id).oninput=render);render();
</script></body></html>
